<svg width="680" height="724" viewBox="0 0 680 724" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Current data pipeline for core_io_monitor</title>
<desc>system_profiler feeds collectors.py, which flows through parsers.py, models.py, diff_engine.py, into monitor.py. ioreg is defined but not wired into the live path.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<style>
.t{font-family:sans-serif;font-size:14px;fill:#2C2C2A}
.ts{font-family:sans-serif;font-size:12px;fill:#5F5E5A}
.th{font-family:sans-serif;font-size:14px;font-weight:500;fill:#2C2C2A}
.arr{stroke:#5F5E5A;stroke-width:1.5;fill:none}
.leader{stroke:#888780;stroke-width:1;stroke-dasharray:4 3;fill:none}
.c-teal rect{fill:#E1F5EE;stroke:#0F6E56}
.c-teal .th{fill:#085041}
.c-teal .ts{fill:#0F6E56}
.c-gray rect{fill:#F1EFE8;stroke:#5F5E5A}
.c-gray .th{fill:#444441}
.c-gray .ts{fill:#5F5E5A}
</style>
</defs>

<text class="ts" x="340" y="24" text-anchor="middle">Teal = active data path &#183; Gray dashed = defined, not wired in</text>

<line x1="228" y1="104" x2="340" y2="164" class="arr" marker-end="url(#arrow)"/>
<line x1="462" y1="104" x2="340" y2="164" class="leader" marker-end="url(#arrow)"/>

<g class="c-teal">
<rect x="118" y="48" width="220" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="228" y="68" text-anchor="middle" dominant-baseline="central">system_profiler</text>
<text class="ts" x="228" y="88" text-anchor="middle" dominant-baseline="central">USB + Thunderbolt JSON, polled</text>
</g>

<g class="c-gray">
<rect x="362" y="48" width="200" height="56" rx="8" stroke-width="0.5" stroke-dasharray="4 3"/>
<text class="th" x="462" y="68" text-anchor="middle" dominant-baseline="central">ioreg -p IOUSB -l -w0</text>
<text class="ts" x="462" y="88" text-anchor="middle" dominant-baseline="central">defined, never called</text>
</g>

<line x1="340" y1="220" x2="340" y2="280" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="336" x2="340" y2="396" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="452" x2="340" y2="512" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="568" x2="340" y2="628" class="arr" marker-end="url(#arrow)"/>

<g class="c-teal">
<rect x="180" y="164" width="320" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="184" text-anchor="middle" dominant-baseline="central">collectors.py</text>
<text class="ts" x="340" y="204" text-anchor="middle" dominant-baseline="central">only file allowed to shell out</text>
</g>

<g class="c-teal">
<rect x="180" y="280" width="320" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="300" text-anchor="middle" dominant-baseline="central">parsers.py</text>
<text class="ts" x="340" y="320" text-anchor="middle" dominant-baseline="central">pure JSON &#8594; dataclasses, no I/O</text>
</g>

<g class="c-teal">
<rect x="180" y="396" width="320" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="416" text-anchor="middle" dominant-baseline="central">models.py</text>
<text class="ts" x="340" y="436" text-anchor="middle" dominant-baseline="central">dataclasses + domain logic</text>
</g>

<g class="c-teal">
<rect x="180" y="512" width="320" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="532" text-anchor="middle" dominant-baseline="central">diff_engine.py</text>
<text class="ts" x="340" y="552" text-anchor="middle" dominant-baseline="central">pure snapshot-diff &#8594; DeviceEvent list</text>
</g>

<g class="c-teal">
<rect x="180" y="628" width="320" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="648" text-anchor="middle" dominant-baseline="central">monitor.py</text>
<text class="ts" x="340" y="668" text-anchor="middle" dominant-baseline="central">live poll + offline test paths &#8594; diff()</text>
</g>
</svg>
